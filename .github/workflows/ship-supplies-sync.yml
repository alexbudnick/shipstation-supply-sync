name: Ship Supplies Sync

on:
  schedule:
    # Runs hourly at minute 17
    - cron: "17 * * * *"

  workflow_dispatch:

jobs:
  sync-ship-supplies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sync ShipStation supply usage
        run: |
          RESPONSE=$(curl --fail --show-error --silent \
            "https://shipstation-supply-sync-production.up.railway.app/jobs/shipstation/supplies-sync?secret=${{ secrets.SHIP_SUPPLIES_SECRET }}")

          echo "$RESPONSE" | jq '{
            ok,
            dryRun,
            recordsChecked,
            movementsCreated,
            skipped,
            warnings
          }'
